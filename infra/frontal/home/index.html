<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecosistema CELDA</title>
<meta name="description" content="Acceso a los servicios del ecosistema CELDA: guías docentes y encuestas de satisfacción.">
<style>
  :root {
    --fondo: #f4f5f7; --superficie: #ffffff; --texto: #24292f; --tenue: #5f6670;
    --borde: #dde1e6; --acento: #2c4a6e; --acento-hover: #1f3651;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #16191d; --superficie: #20242a; --texto: #e6e8eb; --tenue: #a3a9b1;
      --borde: #353a42; --acento: #8fb3dc; --acento-hover: #b0cbea;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
  h1 { font-weight: 600; font-size: 2rem; margin: 0 0 0.25rem; letter-spacing: 0.02em; }
  .subtitulo { color: var(--tenue); margin: 0 0 2rem; }
  .servicios { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; list-style: none; padding: 0; margin: 0; }
  .servicio a { display: block; height: 100%; background: var(--superficie); border: 1px solid var(--borde); border-top: 4px solid var(--acento); border-radius: 4px; padding: 1.2rem 1.25rem; color: inherit; text-decoration: none; }
  .servicio a:hover, .servicio a:focus-visible { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 25%, transparent); }
  .encabezado-servicio { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.3rem; }
  .icono-servicio { width: 4.6rem; height: 4.6rem; border-radius: 6px; flex-shrink: 0; }
  .servicio h2 { margin: 0; font-size: 1.3rem; font-weight: 600; color: var(--acento); }
  .servicio p { margin: 0 0 0.6rem; }
  .estado-servicio { display: block; text-align: right; font-size: 0.7rem; color: var(--tenue); margin-top: 0.3rem; }
  footer { color: var(--tenue); font-size: 0.85rem; margin-top: 3rem; }
  footer a { color: var(--tenue); }
</style>
</head>
<body>
<main>
  <h1>Ecosistema CELDA</h1>
  <p class="subtitulo">Servicios construidos sobre COLMENA.</p>

  <ul class="servicios">
    <li class="servicio">
      <a href="https://celda.mmasias.cloud-ip.cc">
        <div class="encabezado-servicio">
          <h2>CELDA</h2>
          <img src="logo-celda.png" alt="" class="icono-servicio">
        </div>
        <p>Guías docentes: programas, asignaturas, planificación de sesiones y revisión de guías.</p>
        <span class="estado-servicio" data-estado="celda"></span>
      </a>
    </li>
    <li class="servicio">
      <a href="https://pulso.mmasias.cloud-ip.cc">
        <div class="encabezado-servicio">
          <h2>PULSO</h2>
          <img src="logo-pulso.png" alt="" class="icono-servicio">
        </div>
        <p>Encuestas anónimas mediante código de invitación.</p>
        <span class="estado-servicio" data-estado="pulso"></span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/mmasias/_ECOSISTEMA_CELDA">Mapa del ecosistema</a>
  </footer>
</main>
<script>
  // Cada servicio expone /api/version (o el equivalente que ya tuviera, caso
  // CELDA): {"version": "x.y.z", "esquema_version": N}. El frontal reenvía
  // en /estado/<servicio> desde el mismo origen -- si el servicio aún no lo
  // expone (404 o error de red), el hueco queda vacío sin romper nada.
  function pintarEstado(id) {
    fetch('/estado/' + id)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        var texto = d.esquema_version != null ? 'esquema ' + d.esquema_version : '';
        if (d.version) texto = 'v' + d.version + (texto ? ' · ' + texto : '');
        document.querySelector('[data-estado="' + id + '"]').textContent = texto;
      })
      .catch(function () {});
  }
  pintarEstado('celda');
  pintarEstado('pulso');
</script>
</body>
</html>
